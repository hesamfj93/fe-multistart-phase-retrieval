[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-uq"
version = "1.0.0"
description = "Fourier-error-guided multi-start reconstruction for untrained-network phase retrieval"
authors = [{ name = "Hesamoddin Faraji" }]
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[tool.setuptools.packages.find]
include = ["pr_uq*"]
exclude = ["tests*", "results*", "configs*", "scripts*"]
