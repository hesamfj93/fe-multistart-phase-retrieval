evaluation:
  failure_psnr_db: 15.0
  auroc_min_per_class: 5
experiment:
  name: stage3_complex_heldout
  output_dir: results/stage3_complex_heldout
  seed: 0
  device: auto
  save_arrays: true
  save_images: true
  save_checkpoints: false
  cleanup_member_cache: true
dataset:
  name: mnist
  n_images: 100
  size: 32
  root: ./data
  split: test
  download: true
  seed: 0
  protocol_split: heldout
  splits_dir: splits
  rank_start: 100
  object:
    class: complex
    phase_sigma_px: 3.0
    phase_max_rad: 1.5707963267948966
    phase_seed_offset: 1000003
measurement:
  oversample: 2
  noise_model: none
  noise_level: 0.0
  noise_seed: 0
model:
  z_channels: 128
  z_hw: 4
  base_ch: 128
ensemble:
  K: 5
  base_seed: 0
trainer:
  iterations: 3000
  lr_theta: 0.001
  lr_z: 0.001
  optimize_z: true
  grad_clip: 1.0
  data_loss: magnitude_l2
  lambda_tv_A: 0.001
  lambda_tv_phi: 0.0001
  lambda_phi_l2: 0.0
  lambda_support: 0.01
  use_spectral_annealing: true
  sigma_start_frac: 0.5
  sigma_end_frac: 0.05
  annealing_schedule: log
  annealing_fraction: 0.6
  use_physics_projection: true
  beta_schedule:
    type: linear
    start: 0.7
    end: 0.1
  project_in_loss: true
  project_detached: true
  use_adaptive_support: true
  support_initial_fill: full
  support_update_every: 200
  support_smooth_sigma: 1.0
  support_threshold_frac: 0.08
  support_gamma: 10.0
  log_every: 150
uncertainty:
  alpha: 0.5
  alphas_sweep:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  normalization: robust
  summary: mean
  n_bins_ece: 15
  fidelity_temperature: 0.05
failure_detection:
  threshold_kind: relative
  threshold_value_db: 15.0
  margin_db: 5.0
