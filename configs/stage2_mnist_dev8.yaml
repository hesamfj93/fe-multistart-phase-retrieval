# OPTIONAL development-subset run under the frozen Stage-2 design.
# Runs the 8 development images (splits/mnist_test_dev_indices.csv) with exactly the
# held-out hyperparameters. Results are reported ONLY in the development section and
# must not be used to change any design choice. Not part of the paper's primary table.
experiment:
  name: stage2_mnist_dev8
  output_dir: results/stage2_mnist_dev8
  seed: 0
  device: auto               # the runner refuses a silent CPU fallback for this split
  cleanup_member_cache: true
dataset:
  name: mnist
  split: test
  protocol_split: dev
  splits_dir: splits
  n_images: 8                # all 8 development images
  size: 32
  root: ./data
measurement:
  oversample: 2
  noise_model: none
  noise_level: 0.0
  noise_seed: 0
model:
  z_channels: 128
  z_hw: 4
  base_ch: 128
ensemble:
  K: 5
  base_seed: 0               # member k uses seed base_seed + k; K=1 is member 0
trainer:
  iterations: 3000
  lr_theta: 1.0e-3
  lr_z: 1.0e-3
  optimize_z: true
  grad_clip: 1.0
  data_loss: magnitude_l2
  lambda_tv_A: 1.0e-3
  lambda_tv_phi: 1.0e-4
  lambda_support: 1.0e-2
  use_spectral_annealing: true
  sigma_start_frac: 0.5
  sigma_end_frac: 0.05
  use_physics_projection: true
  beta_schedule: { type: linear, start: 0.7, end: 0.1 }
  use_adaptive_support: true
  support_update_every: 200
  log_every: 150
uncertainty:
  fidelity_temperature: 0.05 # FROZEN, selected on the development images
  n_bins_ece: 15
evaluation:
  # Pre-specified before the held-out run (part of the protocol lock).
  failure_psnr_db: 15.0         # a reconstruction with PSNR below this is a failure
  auroc_min_per_class: 5        # failure-detection AUROC only if >= 5 failures and >= 5 successes
