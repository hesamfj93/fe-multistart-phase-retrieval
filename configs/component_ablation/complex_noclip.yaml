# Component ablation (STUDY3_DEV_PLAN.md Section 3): configs/stage3_complex_dev.yaml with {'grad_clip': 0.0}
experiment:
  name: component_ablation_complex_noclip
  output_dir: results/component_ablation/complex_noclip
  seed: 0
  device: auto
  cleanup_member_cache: true
dataset:
  name: mnist
  split: test
  protocol_split: dev
  splits_dir: splits
  n_images: 8
  rank_start: 0
  size: 32
  root: ./data
  object:
    class: complex
    phase_sigma_px: 3.0
    phase_max_rad: 1.5707963267948966
    phase_seed_offset: 1000003
measurement:
  oversample: 2
  noise_model: none
  noise_level: 0.0
  noise_seed: 0
model:
  z_channels: 128
  z_hw: 4
  base_ch: 128
ensemble:
  K: 5
  base_seed: 0
trainer:
  iterations: 3000
  lr_theta: 0.001
  lr_z: 0.001
  optimize_z: true
  grad_clip: 0.0
  data_loss: magnitude_l2
  lambda_tv_A: 0.001
  lambda_tv_phi: 0.0001
  lambda_support: 0.01
  use_spectral_annealing: true
  sigma_start_frac: 0.5
  sigma_end_frac: 0.05
  use_physics_projection: true
  beta_schedule:
    type: linear
    start: 0.7
    end: 0.1
  use_adaptive_support: true
  support_update_every: 200
  log_every: 150
uncertainty:
  fidelity_temperature: 0.05
  n_bins_ece: 15
evaluation:
  failure_psnr_db: 15.0
  auroc_min_per_class: 5
