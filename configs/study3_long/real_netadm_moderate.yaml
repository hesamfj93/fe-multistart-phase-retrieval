# STUDY3_LONG_PLAN.md: one long start (seed 0) for real_netadm_moderate.
# Equal to configs/study3/real_netadm_moderate.yaml except experiment name, output folder,
# single_method_name, ensemble.K = 1 and the iteration budget. Net-ADM: 5000 outer iterations (5 x 1000).
# The step learning-rate schedule stretches with the run: halved every 2500 outer iterations (5 x 500).
experiment:
  name: study3_long_real_netadm_moderate
  output_dir: results/study3_long/real_netadm_moderate
  seed: 0
  device: auto
  cleanup_member_cache: true
  single_method_name: k1_long
dataset:
  name: mnist
  split: test
  protocol_split: heldout3
  splits_dir: splits
  n_images: 50
  size: 32
  root: ./data
  rank_start: 0
measurement:
  oversample: 2
  noise_model: poisson
  noise_level: 30000.0
  noise_seed: 0
model:
  z_channels: 128
  z_hw: 4
  base_ch: 128
ensemble:
  K: 1
  base_seed: 0
trainer:
  iterations: 3000
  lr_theta: 0.001
  lr_z: 0.001
  optimize_z: true
  grad_clip: 1.0
  data_loss: magnitude_l2
  lambda_tv_A: 0.001
  lambda_tv_phi: 0.0001
  lambda_support: 0.01
  use_spectral_annealing: true
  sigma_start_frac: 0.5
  sigma_end_frac: 0.05
  use_physics_projection: true
  beta_schedule:
    type: linear
    start: 0.7
    end: 0.1
  use_adaptive_support: true
  support_update_every: 200
  log_every: 150
uncertainty:
  fidelity_temperature: 0.05
  n_bins_ece: 15
evaluation:
  failure_psnr_db: 15.0
  auroc_min_per_class: 5
solver:
  type: netadm
  netadm:
    outer_iters: 5000
    inner_steps: 5
    lr: 0.005
    lr_decay_every: 2500
    lr_decay: 0.5
    rho: 1.0
    eps: 0.001
    widths:
    - 25
    - 15
    - 10
